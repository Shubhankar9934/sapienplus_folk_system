[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folk-ai-council"
version = "0.1.0"
description = "FOLK AI Council - evidence-centric cultural intelligence scoring platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FOLK" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "json-repair>=0.30",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
llm = [
    # Native web-search research: Anthropic Messages web_search server tool and
    # OpenAI Responses web_search tool. No external/shared search backend is used.
    "anthropic>=0.49",
    "openai>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
stats = [
    # scipy is now a core dependency; this extra is retained for backward compat.
    "scipy>=1.11",
]

[project.scripts]
folk = "folk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
